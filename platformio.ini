; Huntsman - 8-legged spider robot
; ESP32-S3-WROOM-1U + 2x PCA9685 (0x40 left legs, 0x41 right legs) + VL53L0X ToF (0x29)
; https://docs.platformio.org/page/projectconf.html
;
; Environments:  wifi = upload + console over the network (normal use)
;                usb  = upload + console over the UART USB cable (recovery)

[platformio]
default_envs = wifi

; Settings shared by both environments
[huntsman]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Show typed text, send the line on Enter, and don't hold the board in reset via DTR/RTS
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
monitor_dtr = 0
monitor_rts = 0
; deep+ lets PlatformIO find SPI.h, which Adafruit BusIO needs
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    pololu/VL53L0X@^1.3.1
    h2zero/NimBLE-Arduino@^2.1.0
    asukiaaa/XboxSeriesXControllerESP32_asukiaaa@^1.1.3
    asukiaaa/XboxControllerNotificationParser
    asukiaaa/XboxSeriesXHIDReportBuilder_asukiaaa
; Wi-Fi + OTA + BLE outgrow the default 1.25 MB app slot. min_spiffs = 1.9 MB app, OTA kept.
; A partition-table change needs ONE USB upload; Wi-Fi uploads work again after that.
board_build.partitions = min_spiffs.csv
; Uncomment ONLY if you plug into the port labelled "USB" (not "UART"/"COM"):
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; Wi-Fi: OTA upload and network console at huntsman.local (board must already run Wi-Fi firmware)
[env:wifi]
extends = huntsman
upload_protocol = espota
upload_port = huntsman.local
custom_ota_host = huntsman.local
; CLion passes its COM-port switcher value as the upload port; this swaps it back to the host
extra_scripts = post:scripts/ota_port.py
monitor_port = socket://huntsman.local:23

; USB cable on the UART port (COM4) - first flash or recovery
[env:usb]
extends = huntsman
